upstream django {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name hexashop.com www.hexashop.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hexashop.com www.hexashop.com;

    ssl_certificate /etc/letsencrypt/live/hexashop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexashop.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static files — long cache
    location /static/ {
        alias /var/www/hexashop/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/hexashop/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django backend
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Restrict admin to known IPs in production
        # allow 203.0.113.0/24;
        # deny all;
    }

    location /health/ {
        proxy_pass http://django;
        access_log off;
    }

    location /metrics {
        proxy_pass http://django;
        # Restrict metrics endpoint
        # allow 127.0.0.1;
        # deny all;
    }

    location /sitemap.xml {
        proxy_pass http://django;
        expires 6h;
        add_header Cache-Control "public";
    }

    location /robots.txt {
        proxy_pass http://django;
        expires 24h;
    }

    # Frontend (served by Vercel in production — this block is for VPS-only mode)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Rate limit zones
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
