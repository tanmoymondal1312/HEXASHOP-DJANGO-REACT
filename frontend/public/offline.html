<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · HEXASHOP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: #0A0E1A; color: #e5e7eb;
      font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 2rem;
    }
    .hex { filter: drop-shadow(0 0 10px rgba(233,185,73,0.4)); margin-bottom: 1.2rem; }
    h1 {
      font-size: 1.5rem; letter-spacing: 0.18em; font-weight: 700;
      background: linear-gradient(100deg, #f5d778, #e9b949, #fff3c4, #c9971c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 0.8rem;
    }
    p { color: #8b9ab5; font-size: 0.95rem; line-height: 1.7; font-family: Arial, sans-serif; }
    button {
      margin-top: 1.6rem; padding: 0.7rem 2rem; border: 1px solid rgba(233,185,73,0.5);
      background: transparent; color: #e9b949; border-radius: 8px;
      font-size: 0.85rem; letter-spacing: 0.08em; cursor: pointer;
    }
    button:hover { background: rgba(233,185,73,0.1); }
  </style>
</head>
<body>
  <div>
    <svg class="hex" width="56" height="62" viewBox="0 0 34 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="17,1 33,10 33,28 17,37 1,28 1,10" fill="none" stroke="#e9b949" stroke-width="1.6"/>
      <text x="17" y="24" text-anchor="middle" fill="#e9b949" font-size="14" font-weight="700" font-family="Georgia,serif">H</text>
    </svg>
    <h1>HEXASHOP</h1>
    <p>You appear to be offline.<br/>Please check your connection — your luxury edit awaits.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
