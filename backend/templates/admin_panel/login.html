<body class="bg-[#0f1117] min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-8">
      <svg width="44" height="49" viewBox="0 0 34 38" fill="none" style="margin:0 auto 10px;display:block;filter:drop-shadow(0 0 8px rgba(233,185,73,0.4))">
        <defs><linearGradient id="lgGold" x1="0" y1="0" x2="34" y2="38" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#f5d778"/><stop offset="45%" stop-color="#e9b949"/>
          <stop offset="70%" stop-color="#fff3c4"/><stop offset="100%" stop-color="#c9971c"/>
        </linearGradient></defs>
        <polygon points="17,1 33,10 33,28 17,37 1,28 1,10" fill="none" stroke="url(#lgGold)" stroke-width="1.6"/>
        <polygon points="17,5.5 28.5,12 28.5,26 17,32.5 5.5,26 5.5,12" fill="rgba(233,185,73,0.07)" stroke="rgba(233,185,73,0.45)" stroke-width="0.8"/>
        <text x="17" y="24" text-anchor="middle" fill="url(#lgGold)" font-size="14" font-weight="700" font-family="Cinzel, Georgia, serif">H</text>
      </svg>
      <p class="text-3xl font-bold lux-word">HEXASHOP</p>
      <p class="text-gray-500 text-sm mt-1">Admin Panel</p>
    </div>

    <!-- Card -->
    <div class="bg-[#1a1d27] border border-[#2a2d3a] rounded-2xl p-8 shadow-2xl">
      <h2 class="text-xl font-semibold text-white mb-6">Sign in</h2>

      {% if error %}
      <div class="mb-4 bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg px-4 py-3 text-sm">
        {{ error }}
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Email address</label>
            <input type="email" name="email" required autofocus
                   class="w-full bg-[#0f1117] border border-[#2a2d3a] text-gray-200 rounded-lg
                          px-4 py-3 text-sm placeholder-gray-600 focus:outline-none
                          focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                   placeholder="you@example.com" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Password</label>
            <input type="password" name="password" required
                   class="w-full bg-[#0f1117] border border-[#2a2d3a] text-gray-200 rounded-lg
                          px-4 py-3 text-sm placeholder-gray-600 focus:outline-none
                          focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                   placeholder="••••••••" />
          </div>
        </div>
        <button type="submit"
                class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold
                       py-3 rounded-lg transition text-sm">
          Sign in →
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-600 mt-6">
      Use your staff email address to log in.
    </p>
  </div>
</body>
</html>
